<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Danh sách nhân viên</title>
</head>
<body>
<main>
    <h1>Danh sách nhân viên</h1>
    <p><a th:href="@{/employees/statistics}">Thống kê nhân viên</a></p>
    <p><a th:href="@{/employees/add}">Thêm nhân viên</a></p>
    <form method="get" th:action="@{/employees/list}">
        <label for="name">Họ tên</label>
        <input id="name" type="search" name="name" th:value="${name}">
        <label for="department">Phòng ban</label>
        <select id="department" name="department">
            <option value="">Tất cả phòng ban</option>
            <option th:each="item : ${departments}" th:value="${item.name}"
                    th:text="${item.name}" th:selected="${item.name == department}"></option>
        </select>
        <button type="submit">Tìm kiếm</button>
        <a th:href="@{/employees/list}">Xóa bộ lọc</a>
    </form>
    <table>
        <thead>
        <tr><th>ID</th><th>Họ tên</th><th>Email</th><th>Phòng ban</th></tr>
        </thead>
        <tbody>
        <tr th:each="employee : ${employees}">
            <td th:text="${employee.id}"></td>
            <td th:text="${employee.name}"></td>
            <td th:text="${employee.email}"></td>
            <td th:text="${employee.department.name}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(employees)}">
            <td colspan="4">Không có nhân viên phù hợp.</td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
